[package]
name = "lapdw"
version = "0.1.0"
description = "Lapdw — desktop multi-thread downloader"
authors = ["lapintool"]
license = "MIT"
edition = "2021"

[lib]
name = "lapdw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks", "gzip"] }
tokio = { version = "1", features = ["sync", "fs", "time", "rt-multi-thread", "macros", "io-util"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
bytes = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
